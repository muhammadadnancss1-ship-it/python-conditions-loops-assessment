<text x="62" y="314" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#16243B" font-weight="400" text-anchor="start"><tspan x="62" dy="0">candidate_name; academic_marks</tspan><tspan x="62" dy="24">attand_percentage; income</tspan><tspan x="62" dy="24">marks; attand; income_info; scholorship</tspan></text>
<text x="62" y="455" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" fill="#7944C9" font-weight="700" text-anchor="start"><tspan x="62" dy="0">INLINE LITERALS  /  NO NAMED CONSTANTS</tspan></text>
<text x="62" y="480" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#16243B" font-weight="400" text-anchor="start"><tspan x="62" dy="0">80; 85; 50,000; 90; 0; 100</tspan></text>
<path d="M40 503 H540" stroke="#DDE5EE"/>
