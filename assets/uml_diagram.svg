<text x="602" y="314" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#16243B" font-weight="400" text-anchor="start"><tspan x="602" dy="0">total_medicines; total_revenue</tspan><tspan x="602" dy="24">restock_count; processed_medicines</tspan><tspan x="602" dy="24">medicine_name; available_stock</tspan><tspan x="602" dy="24">price_per_unit; quantity_sold</tspan><tspan x="602" dy="24">sales_amount; remaining_stock; medicine</tspan></text>
