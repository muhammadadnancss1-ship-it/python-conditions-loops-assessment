<text x="62" y="564" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#16243B" font-weight="400" text-anchor="start"><tspan x="62" dy="0">Read and convert inputs</tspan><tspan x="62" dy="25">Validate → choose award → print report</tspan></text>
