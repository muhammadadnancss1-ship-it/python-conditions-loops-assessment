<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="930" viewBox="0 0 1120 930" role="img" aria-labelledby="title desc">
<title id="title">UML module diagram</title><desc id="desc">Procedural modules, top-level state, inline thresholds, statement sections and calls to Python built-ins. There are no custom functions, classes, imports or inter-module calls.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#53647B"/></marker>
<linearGradient id="banner-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ECF5FF"/><stop offset="0.58" stop-color="#F4F1FF"/><stop offset="1" stop-color="#E8F7F1"/></linearGradient>
</defs>
<rect width="1120" height="930" fill="#FFFFFF"/>
<text x="44" y="42" font-family="Arial, DejaVu Sans, sans-serif" font-size="12" fill="#1764D5" font-weight="700" text-anchor="start"><tspan x="44" dy="0">04 / CODE STRUCTURE</tspan></text>
<text x="44" y="78" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" fill="#16243B" font-weight="700" text-anchor="start"><tspan x="44" dy="0">Procedural modules &amp; their dependencies</tspan></text>
<text x="44" y="108" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" fill="#53647B" font-weight="400" text-anchor="start"><tspan x="44" dy="0">UML module view: the programs execute independently from top to bottom.</tspan></text>
