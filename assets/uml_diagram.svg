<text x="602" y="564" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#16243B" font-weight="400" text-anchor="start"><tspan x="602" dy="0">Read count → for / range loop</tspan><tspan x="602" dy="25">Validate → sell/reject → restock → report</tspan></text>
