<polyline points="830,630 830,726" fill="none" stroke="#53647B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="844" y="685" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" fill="#53647B" font-weight="600" text-anchor="start"><tspan x="844" dy="0">«calls»</tspan></text>
