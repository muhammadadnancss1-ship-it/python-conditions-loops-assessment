<text x="560.0" y="876.6" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" fill="#16243B" font-weight="500" text-anchor="middle"><tspan x="560.0" dy="0">No imports, shared state, classes, or calls between the two application files.</tspan></text>
