<text x="290.0" y="764.58" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#16243B" font-weight="500" text-anchor="middle"><tspan x="290.0" dy="0">Python built-ins / methods</tspan><tspan x="290.0" dy="22.72">input()  ·  float()  ·  print()</tspan></text>
